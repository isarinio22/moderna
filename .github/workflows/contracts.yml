name: Upstream contracts

# The pipeline reads four public services. If one renames a field or changes a
# sequence, every unit test still passes while the pipeline quietly breaks. This
# runs the live contract tests on a schedule so that drift is found here rather
# than by someone cloning the repository.
#
# Allowed to fail: a third-party outage should not show the project as broken.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-apis:
    name: Public API contracts
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: cBioPortal, Genome Nexus, UniProt and Ensembl GRCh37
        run: pytest -q -m network

  prediction-models:
    name: MHCflurry models
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install with CPU-only PyTorch
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,predict]"
      - name: Cache prediction models
        uses: actions/cache@v4
        with:
          path: ~/.cache/mhcflurry
          # Keyed on the weights release, not the package version: mhcflurry
          # ships frequent patch releases that keep the same model weights.
          key: mhcflurry-models-2.3.0-presentation
      - name: Download models
        run: |
          echo "MHCFLURRY_DOWNLOADS_DIR=$HOME/.cache/mhcflurry" >> $GITHUB_ENV
          mhcflurry downloads fetch models_class1_presentation --release 2.3.0
      - run: pytest -q -m models
